<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM Symbol</title>
    <style>
        /* 1. 字体加载 */
        @font-face {
            font-family: 'HMSymbolVF';
            src: url('HMSymbolVF.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        /* 基础样式和颜色 */
        :root {
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-color: #333;
            --icon-color: #FF5014;
            --name-color: #343a40;
            --unicode-color: #6c757d;
            --toast-bg: #ff9875; 
            --toast-text: #000000;
            --input-border: #ccc;
            --input-focus: #FF5014;
        }

        body {
            font-family: 'Consolas', 'Menlo';
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* 搜索栏样式 */
        .search-container {
            max-width: 800px;
            margin: 0 auto 30px;
            text-align: center;
        }

        #search-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        #search-input:focus {
            border-color: var(--input-focus);
            outline: none;
        }

        .count-info {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
        }

        /* 符号容器 - 使用 CSS Grid */
        #symbols-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 符号卡片样式 */
        .symbol-item {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* 修正 min-height，使其保持稳定 */
            min-height: 110px; 
        }

        /* 悬停效果 */
        .symbol-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* 符号图标 */
        .icon {
            font-family: 'HMSymbolVF';
            font-size: 36px;
            display: block;
            margin: 5px 0 10px 0;
            color: var(--icon-color);
            font-weight: 400;
        }

        /* 名称和 Unicode 码点文本 */
        .name,
        .unicode {
            font-size: 11px;
            word-break: break-all;
            line-height: 1.4;
            min-height: 15px;
        }

        .name {
            font-weight: 600;
            color: var(--name-color);
        }

        .unicode {
            color: var(--unicode-color);
        }

        /* --- Toast 提示框样式 --- */
        #toast {
            visibility: hidden; /* 默认隐藏 */
            min-width: 250px;
            background-color: var(--toast-bg);
            color: var(--toast-text);
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000; 
            left: 50%;
            bottom: 30px; 
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px; /* 向上移动一点以示动画 */
        }
    </style>
</head>

<body>

    <h1>HM Symbol 符号表</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="输入图标名称或 Unicode 进行搜索...">
        <p id="count-info" class="count-info">正在加载...</p>
    </div>

    <div id="symbols-container">
    </div>

    <div id="toast">名称已复制到剪贴板!</div>

    <script>
        const container = document.getElementById('symbols-container');
        const searchInput = document.getElementById('search-input');
        const countInfo = document.getElementById('count-info');
        const toastElement = document.getElementById('toast');
        let allSymbols = []; // 存储所有符号的原始数组

        // --- Toast 显示函数 ---
        let toastTimeout;
        const showToast = (message) => {
            toastElement.textContent = message;
            // 清除之前的定时器
            clearTimeout(toastTimeout);
            
            // 显示 Toast
            toastElement.classList.add('show');

            // 1.5 秒后隐藏 Toast
            toastTimeout = setTimeout(() => {
                toastElement.classList.remove('show');
            }, 1500); 
        };

        // --- 复制 Fallback 方法（解决浏览器安全限制导致的复制失败） ---
        const fallbackCopyTextToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            let successful = false;
            try {
                successful = document.execCommand('copy');
            } catch (err) {
                console.error('Fallback: 无法复制', err);
            }
            document.body.removeChild(textArea);
            return successful;
        };

        // --- 核心复制功能 ---
        function copyToClipboard(text) {
            // 尝试使用现代 Clipboard API
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('名称已复制到剪贴板!');
                }).catch(err => {
                    // Clipboard API 失败，尝试 Fallback 方法
                    console.warn('Clipboard API 失败，尝试 Fallback 复制。', err);
                    if (fallbackCopyTextToClipboard(text)) {
                        showToast('名称已复制到剪贴板!');
                    } else {
                        // 彻底失败时给用户提示
                        alert('复制失败，请手动复制: ' + text);
                    }
                });
            } else {
                // 浏览器不支持 Clipboard API，直接使用 Fallback
                if (fallbackCopyTextToClipboard(text)) {
                    showToast('名称已复制到剪贴板!');
                } else {
                    alert('复制失败，请手动复制: ' + text);
                }
            }
        }

        // --- 渲染符号函数 ---
        function renderSymbols(symbolsToRender) {
            container.innerHTML = ''; // 清空现有内容

            if (symbolsToRender.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #666; margin-top: 30px;">未找到匹配的符号。</p>`;
                return;
            }

            symbolsToRender.forEach(item => {
                const div = document.createElement('div');
                div.className = 'symbol-item';

                const iconSpan = document.createElement('span');
                iconSpan.className = 'icon';
                iconSpan.textContent = item.character;

                const nameDiv = document.createElement('div');
                nameDiv.className = 'name';
                nameDiv.textContent = item.name;

                const unicodeDiv = document.createElement('div');
                unicodeDiv.className = 'unicode';
                unicodeDiv.textContent = item.unicode_hex;

                // 移除 feedbackDiv 相关的代码

                div.appendChild(iconSpan);
                div.appendChild(nameDiv);
                div.appendChild(unicodeDiv);
                // 移除 feedbackDiv 的 appendChild

                // 添加复制功能
                div.addEventListener('click', () => {
                    // 直接调用 copyToClipboard
                    copyToClipboard(item.name);
                });

                container.appendChild(div);
            });
        }

        // --- 搜索和过滤逻辑 ---
        function handleSearch() {
            const term = searchInput.value.toLowerCase().trim();
            let symbolsToRender = [];

            if (!term) {
                // 没有搜索词时，渲染所有符号
                symbolsToRender = allSymbols;
                countInfo.textContent = `共 ${allSymbols.length} 个符号。`;
            } else {
                // 有搜索词时，进行过滤
                symbolsToRender = allSymbols.filter(item =>
                    item.name.toLowerCase().includes(term) ||
                    item.unicode_hex.toLowerCase().includes(term)
                );
                countInfo.textContent = `找到 ${symbolsToRender.length} 个结果。`;
            }

            renderSymbols(symbolsToRender);
        }

        // 绑定搜索事件
        searchInput.addEventListener('input', handleSearch);

        // --- 数据加载 ---
        fetch('symbols.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // 过滤掉空白字符并存储
                allSymbols = data.filter(item =>
                    item.unicode_hex !== "U+0020" && item.unicode_hex !== "U+00A0"
                );

                // 首次渲染：显示所有符号
                handleSearch();
            })
            .catch(error => {
                console.error('加载符号数据失败:', error);
                container.innerHTML = `<p style="color: red; text-align: center; margin-top: 30px;">加载符号数据失败。请检查 symbols.json 文件是否存在且格式正确。</p>`;
                countInfo.textContent = `加载失败。`;
            });

    </script>
</body>

</html>
